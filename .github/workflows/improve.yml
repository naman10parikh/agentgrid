name: Improve

# agentgrid's self-improvement loop. Nightly (and on demand), it runs the evals and measures the live CLI and MCP
# surface against the docs, skills and memory. It writes a proposal to the run summary, an artifact and one open issue
# labelled "proposal". It needs no secret, it never pushes, and it never merges: a person reviews every change. A
# failing eval turns the run red.

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  improve:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm build

      - name: One turn of the loop
        run: node scripts/improve.mjs

      - name: Proposal to the run summary
        if: always()
        run: cat logs/proposal.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposal
          path: logs/proposal.md
          if-no-files-found: ignore

      - name: Open or update the proposal issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          f=logs/proposal.md
          if [ ! -s "$f" ]; then echo "No proposal to open."; exit 0; fi
          body="$RUNNER_TEMP/proposal-issue.md"
          {
            echo "Written by the scheduled self-improvement loop on $(date -u '+%Y-%m-%d %H:%M UTC'). It proposes; a person decides. The loop never merges."
            echo
            cat "$f"
          } > "$body"
          gh label create proposal --color 2f5d8a --description "A change the self-improvement loop proposes for a person to review" --force
          n=$(gh issue list --label proposal --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file "$body"
          else
            gh issue create --title "AgentGrid: proposal from the self-improvement loop" --label proposal --body-file "$body"
          fi
